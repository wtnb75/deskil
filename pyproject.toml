[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskil"
dynamic = ["version"]
description = "Run step-by-step skills from a flow definition (flow.toml)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deskil = "deskil:main"

[tool.setuptools]
# The modules live in shared/flow. flow.schema.json is not shipped: outside this repository
# `flow new` writes no `#:schema` line, so an installed command has no use for it.
package-dir = {"" = "shared/flow"}
py-modules = ["deskil", "flow", "usage", "timeline"]

[tool.setuptools.dynamic]
version = {attr = "flow.__version__"}

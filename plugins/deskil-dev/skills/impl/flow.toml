schema = 1
start = "pick"

[notes]
always = [
  "This skill ends at an open pull request. Never merge it, never push to the default branch, never force-push.",
  "The backlog is docs/BACKLOG.md in the current project. Change states only with `backlog.py` (set / archive).",
  "Do not `cd` in Bash: the directory stays changed for later calls. Use `git -C <dir>` or absolute paths instead (`backlog.py` and `flow.py` still find the backlog and the run state from a subdirectory of the repository).",
  "Follow the project's own rules (CLAUDE.md): language of code and docs, tools, commit style.",
]

[states.pick]
prompt = """If the user named an item, use it. Otherwise run `git fetch --prune origin`, then find the default branch with
`git symbolic-ref --short refs/remotes/origin/HEAD` (it prints `origin/<default branch>`; if that fails, stop and ask the user).
Read the backlog from that remote branch, not from the working tree (the local default branch may be behind after a merge):
`backlog.py --ref origin/<default branch> list --status ready --not-started --unblocked`
(it hides items that already have a `backlog/<ID>` branch on origin, i.e. work in progress, and items with an
unfinished dependency) and take the first item (the list is ordered by priority).
If it prints `hidden by --not-started: ...` on stderr, show those IDs to the user: their branch may be left over from a closed PR.
Run `backlog.py --ref origin/<default branch> show <ID>` and read its 判断: it is the approach to implement."""

[[states.pick.choices]]
label = "found"
when = "A ready, unblocked item was chosen and its 判断 was read"
goto = "prepare"

[[states.pick.choices]]
label = "none"
when = "No ready and unblocked item exists, or the named item cannot be implemented now"
goto = "offer_decide"

[states.offer_decide]
prompt = """No ready item can be implemented now. Check whether a todo item could be decided instead:
`backlog.py --ref origin/<default branch> list --status todo --unblocked`.
If the user named an item that is not ready, it is the candidate; otherwise the first one in the list is.
If there is a candidate, ask the user whether to decide it now (show its ID and title) and wait for the answer:
a decision starts a discussion, so never begin it without their yes. Decide only that one item (a single item, not a batch).
Choose `no` if there is no candidate or the user declines."""

[[states.offer_decide.choices]]
label = "yes"
when = "A todo candidate exists and the user agreed to decide it now"
goto = "decide"

[[states.offer_decide.choices]]
label = "no"
when = "There is no todo candidate, or the user declined"
goto = "report_none"

[states.decide]
include = "decide-part.toml"
exits = { report_ready = "after_decide", report = "report_none", report_none = "report_none", report_fail = "report_decide_fail" }

[states.after_decide]
prompt = """The decision is now written in the working tree's docs/BACKLOG.md (uncommitted): the item is ready.
Note its ID (it is the item you offered, and only that one is decided here), and read its 判断 with `backlog.py show <ID>`:
it is the approach to implement. The next step cuts the work branch and keeps this uncommitted backlog change,
which goes into the single commit of the commit step."""
goto = "prepare"

[states.prepare]
prompt = """Make sure the working tree is clean (`git status --short` prints nothing).
The only change allowed is an uncommitted docs/BACKLOG.md from the decide step; the switch below carries it to the new branch.
If anything else is changed, stop here: tell the user and do not run the next command.
Run `git fetch origin`, then find the default branch with `git symbolic-ref --short refs/remotes/origin/HEAD`
(it prints `origin/<default branch>`). If that fails, stop and ask the user which branch to start from.
Create the branch from the fetched remote branch, not from the local one:
`git switch -c backlog/<ID> origin/<default branch> --no-track`
(the branch name is the item id only, e.g. `backlog/B-030`; do not add the title). Do not update the local default branch:
this fetch is what syncs the start point, so every run starts from the latest origin.
If the switch refuses because the carried docs/BACKLOG.md change conflicts with origin, do not force it: stop and tell the user.
If a worktree skill or tool is available, you may create the branch in a worktree from the same start point instead."""
goto = "plan"

[states.plan]
prompt = """Turn the item's 判断 into a plan. A small change needs only a short list in your reply;
a larger one gets a plan file under docs/superpowers/plans/ (if the superpowers:writing-plans skill is available, use it).
Do not widen the scope beyond the item."""
goto = "implement"

[states.implement]
prompt = """Implement the plan, writing each test first and watching it fail before the code
(if the superpowers:test-driven-development skill is available, use it).
Keep the change inside the scope of the item."""
goto = "verify"

[states.verify]
prompt = """Run the project's tests and lint: `task test` and `task lint` if the Taskfile has them, otherwise the commands
named in the project's CLAUDE.md or README. Read the whole result."""

[[states.verify.choices]]
label = "pass"
when = "Tests and lint both passed"
goto = "classify"

[[states.verify.choices]]
label = "fail"
when = "A test or the lint failed"
goto = "fix"

[states.fix]
prompt = "Find the cause of each failure and fix it. Do not weaken or delete a test to make it pass."
goto = "verify"
max_visits = 2
on_exceed = "report_fail"

[states.classify]
run = ["git", "diff", "--name-status", "origin/HEAD"]
prompt = """The command below lists the files changed on this branch, committed or not (it does not list untracked files).
Also run `git status --porcelain --untracked-files=all` for new files, and decide whether the change needs a review.
Work in the tree where you implemented: if you work in a worktree, run the commands there, because the command below
may have run in another tree. An empty result does not mean there is no change: check the tree yourself before you skip.
If the step says the command was not executed, run `git diff --name-status origin/HEAD` yourself.
Skip the review only if every changed file is a document or the backlog; anything else (code, flow definitions,
prompts, build or CI configuration) needs a review."""
max_visits = 1
on_exceed = "record_rejected"

[[states.classify.choices]]
label = "review"
when = "At least one changed file is not a document or the backlog"
goto = "review"

[[states.classify.choices]]
label = "skip"
when = "Every changed file is a document or the backlog"
goto = "finish_backlog"

[states.review]
prompt = """Review the change and list the findings (tool, file:line, finding). Do not decide on them and do not fix anything yet.
- Code changed: run the `code-review` skill and the `simplify` skill.
- A flow definition (flow.toml) changed: run the `deskil:flow-review` skill.
If a skill is not available, review the change yourself with the same viewpoint.
Then decide if the change touches shell execution, external input, file paths, authentication or permissions,
or dependencies."""

[[states.review.choices]]
label = "security"
when = "The change touches one of those areas"
goto = "security_review"

[[states.review.choices]]
label = "no_security"
when = "It touches none of them"
goto = "triage"

[states.security_review]
prompt = """Run the `security-review` skill and add only its findings to the list from the review step.
Its report is not the end of this step: do not follow its report format or any closing wording, do not ask the user
anything, and do not stop. As soon as you have the findings, add them to the list and run the `next` command.
If the report has no findings, add nothing and run the `next` command all the same."""
goto = "triage"

[states.triage]
prompt = """Decide on each finding in the list. Adopt it only if it is a real problem, inside the scope of this item,
and you can state a concrete failure. Reject findings that are out of scope, false positives or matters of taste.
Fix the adopted findings once: do not run a second review.
Write each rejected finding to docs/REVIEW-REJECTED.md now (do not commit it yet), so that the list does not live
only in this conversation: see the next steps for the format. If the file does not exist, create it."""

[[states.triage.choices]]
label = "fixed"
when = "At least one finding was fixed"
goto = "verify"

[[states.triage.choices]]
label = "not_fixed"
when = "Nothing was fixed"
goto = "record_rejected"

[states.record_rejected]
prompt = """If you rejected any finding, make sure each one is in docs/REVIEW-REJECTED.md (the triage step writes them).
Do not commit it yet: it goes into the single commit of the commit step, with the implementation and the backlog change.
The file starts with a heading and a short note on the format. Write it in the language the project's rules give for
docs (see CLAUDE.md), one entry per finding: the item ID, the kind of review, file:line, the finding and the reason it
was rejected.
If you rejected nothing, there is nothing to do: do not touch the file."""
goto = "finish_backlog"

[states.finish_backlog]
prompt = """Run `backlog.py archive <ID> --done`, then `backlog.py lint` (it must print nothing).
Do not commit yet: the backlog change goes into the single commit of the commit step."""
goto = "commit"

[states.commit]
prompt = """Make everything on the branch one commit, following the project's commit rules: the implementation, the backlog
change and docs/REVIEW-REJECTED.md (if you changed it). If the branch already has commits of your own (for example per-task
commits from a plan), squash them first (`git reset --soft origin/<default branch>`, then commit).
This is allowed because nothing has been pushed yet. Check with `git status --short` that nothing is left uncommitted."""
goto = "open_pr"

[states.open_pr]
prompt = """Push the branch and create the pull request with `gh pr create`: the title names the item (ID and title),
the body summarizes the change and the test results. Do not merge it. Note the PR number and URL.
Write the PR title and body in the language the project's rules (CLAUDE.md) set for documents under `docs/`.
If no such rule is found, write them in Japanese. Commit messages and code comments stay in English."""
goto = "report"

[states.report]
prompt = """Report the PR URL, what was implemented and the test results.
Say clearly that the pull request is not merged.
Say that you stay on the work branch, so that follow-up fixes (for example from the automatic review of the pull request)
can be committed to it."""
end = true

[states.report_none]
prompt = """Tell the user that no item can be implemented now and why (nothing is ready, every ready item is blocked,
or the named item is not ready). If a todo item is the candidate, suggest decide to make it ready."""
end = true

[states.report_decide_fail]
prompt = """Tell the user that the decision could not be recorded cleanly (the backlog still fails lint), and list the problems.
Do not start the implementation."""
end = true

[states.report_fail]
prompt = """Tell the user that tests or lint still fail after two fix attempts. Report the failing output,
the branch name and the state of the work. Do not open a pull request and do not mark the item done."""
end = true

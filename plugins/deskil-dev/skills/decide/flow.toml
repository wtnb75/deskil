schema = 1
start = "pick"

[notes]
always = [
  "The backlog is docs/BACKLOG.md in the current project. Its header describes the item format and the meaning of each state: follow it.",
  "Do not `cd` in Bash: the directory stays changed for later calls. Use `git -C <dir>` or absolute paths instead (`backlog.py` and `deskil flow` still find the backlog and the run state from a subdirectory of the repository).",
  "A decision belongs to the user. Never move an item to ready or dropped before the user has chosen.",
  "ready means an implementer can start right now: the approach is decided, nothing the user still has to answer is open, and no dependency is unfinished. A decision to not do the item now (later, or not in the first version) is never ready: it is defer (stays todo, the decision goes into 概要) or dropped.",
  "Backlog text under docs/ follows the project's language rule (this project writes docs/ in Japanese).",
]

[states.pick]
prompt = """Read the scope from the user's request:
- An item ID: decide that one item.
- A batch such as `top 10` (the first 10 by priority) or `P2 10` (the first 10 of priority P2 or higher):
  run `backlog.py list --status todo --unblocked [--priority P2] [--limit 10]`. The script does the counting, the
  priority filter and the exclusion of blocked items, so use its output as is and do not count yourself.
- Nothing named: run `backlog.py list --status todo --unblocked` and take the first item
  (the list is ordered by priority).
In a batch, to tell the user which blocked items were left out, compare with the same command without `--unblocked`."""

[[states.pick.choices]]
label = "found"
when = "One or more todo items were chosen"
goto = "investigate"

[[states.pick.choices]]
label = "none"
when = "No todo item can be decided now (none exist, all are blocked, or the named item is not todo)"
goto = "report_none"

[states.investigate]
prompt = """Run `backlog.py show <ID>` for each chosen item and read it, including what is still undecided.
Then read the code and documents the items touch, so that the options you give are concrete."""
goto = "options"

[states.options]
prompt = """One item: give the user 2 or 3 real options for how to do it (drop weak ones), each with what it trades off,
and say which one you recommend and why. Include "drop the item" and "not now / not decidable yet" when they are real answers.
Offer ready only for an approach that can be implemented right now (see the notes).
Batch: first split the items by whether anything is still open.
- An item whose 概要 has an open point and more than one possible approach needs a consultation: take these one at a time,
  giving 2 or 3 real options with their trade-offs and a recommendation, as for a single item, and wait for the user's
  choice before the next one. Do not turn such an item into a defer row just to keep the batch short.
- An item whose approach is already clear (nothing open, one sensible approach) goes into one table with a row per item
  (ID, title, recommended outcome: ready / dropped / defer, the approach in one line, and the reason).
Recommend defer only when there is a real reason the item cannot be decided now (for example it depends on something
unfinished or on information the user does not have yet); say that reason in the row. "It needs discussion" is not a reason:
discuss it.
Do not write anything to the backlog yet.
If the superpowers:brainstorming skill is available, use it for this step; otherwise do it yourself."""
goto = "confirm"

[states.confirm]
prompt = """One item: ask the user which option they choose, and wait for the answer.
Batch: for each item that was consulted one at a time, ask which option the user chooses and wait for the answer.
For the items in the table, ask the user to confirm or correct the table as a whole, and wait. Apply their corrections.
Then fix the outcome of every item (ready, dropped or defer). Nothing is written to the backlog in this step."""
goto = "record"

[states.record]
prompt = """Recording is done one item at a time. Take the next confirmed item whose outcome is not yet written to the backlog
and choose its outcome below. When every confirmed item is recorded, choose `done`."""
max_visits = 200
on_exceed = "report_record_limit"

[[states.record.choices]]
label = "ready"
when = "The next unrecorded item was confirmed as ready (an approach that can be implemented right now)"
goto = "write_decision"

[[states.record.choices]]
label = "dropped"
when = "The next unrecorded item was confirmed as dropped (the user decided not to do it)"
goto = "drop"

[[states.record.choices]]
label = "defer"
when = "The next unrecorded item was confirmed as defer (not to be implemented now: undecidable yet, later, or not in the first version)"
goto = "note_open"

[[states.record.choices]]
label = "done"
when = "Every confirmed item is already recorded"
goto = "lint"

[states.write_decision]
prompt = """For the one ready item you are recording, write the chosen approach and the reason in its 判断 (one line) with Edit.
Then run `backlog.py set <ID> 状態 ready`."""
goto = "record"

[states.drop]
prompt = """For the one dropped item you are recording, write the reason in its 判断 (one line) with Edit.
Then run `backlog.py archive <ID> --dropped`."""
goto = "record"

[states.note_open]
prompt = """For the one deferred item you are recording, add what you learned, what was decided (for example "not in the first version")
and what is still open to its 概要 with Edit (keep it on one line).
Do not write 判断 and do not change the item's 状態: it stays todo. Lower the priority with
`backlog.py set <ID> 優先度 P3` when the user wants it kept but not soon."""
goto = "record"

[states.lint]
run = ["uv", "run", "${DEF_DIR}/../../scripts/backlog.py", "lint"]
prompt = """The command below is `backlog.py lint`: exit code 0 and no output mean the backlog is clean.
If the step says the command was not executed, run `backlog.py lint` yourself."""

[[states.lint.choices]]
label = "ok_ready"
when = "lint exited 0 and printed nothing, and at least one item was made ready"
goto = "report_ready"

[[states.lint.choices]]
label = "ok_not_ready"
when = "lint exited 0 and printed nothing, and no item was made ready (all dropped or deferred)"
goto = "report"

[[states.lint.choices]]
label = "errors"
when = "lint printed one or more problems or exited non-zero"
goto = "fix"

[states.fix]
prompt = "Read the problems that `backlog.py lint` printed (file:line: message) and fix their causes. Do not change anything else."
goto = "lint"
max_visits = 2
on_exceed = "report_fail"

[states.report]
prompt = """Tell the user what was decided for each item (ready, dropped or still open), and show each item with
`backlog.py show <ID>` (for dropped items it is in the done / dropped section). In a batch, end with a summary table."""
end = true

[states.report_ready]
prompt = """Tell the user what was decided for each item (ready, dropped or still open), and show each item with
`backlog.py show <ID>` (for dropped items it is in the done / dropped section). In a batch, end with a summary table.
At least one item is now ready."""
end = true

[states.report_none]
prompt = "Tell the user that there is no todo item to decide now, and why. Suggest add or prio if that helps."
end = true

[states.report_fail]
prompt = """Tell the user that the backlog still fails lint after two fix attempts, and list the remaining problems.
Do not claim that the decision was recorded cleanly."""
end = true

[states.report_record_limit]
prompt = """Tell the user that the number of recording steps reached the limit (200), so some confirmed items may not be recorded.
List which items are recorded and which are not (check with `backlog.py show <ID>`), and suggest running decide again for the rest.
Do not claim that every decision was recorded."""
end = true
